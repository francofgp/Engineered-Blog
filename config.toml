[markup.highlight]
# Emit Chroma class names (`<span class="k">…</span>`) instead of inline `style="…"`.
# This lets us ship two stylesheets (light/dark) and switch via [data-bs-theme] in head.html.
# Light styling lives in   assets/css/chroma-light.css   (regenerate: `hugo gen chromastyles --style=manni > assets/css/chroma-light.css`)
# Dark  styling lives in   assets/css/chroma-dark.css    (regenerate: `hugo gen chromastyles --style=dracula > assets/css/chroma-dark.css`)
# The `style` field below is ignored when noClasses=false, kept here as historical reference.
noClasses = false
style = 'manni'

############################# share-buttons ########################

 [params.shareButtons]
  networks = [ "facebook", "twitter", "linkedin", "email", "reddit"]
  size = "small"
  icon = "solid"
  buttonMargin = "0.2em"

############################# robots.txt ########################
enableRobotsTXT = true


[sitemap]
# 'always' tells crawlers the page changes every visit (e.g. dynamic homepages of news sites).
# For a personal blog this is misleading — most crawlers ignore it. 'monthly' is honest for
# evergreen posts; Hugo overrides per-page via the `sitemap` front-matter map if needed.
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5