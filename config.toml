#################### default parameters ################################
[params]
logo = "images/logo.png"
nameSite= "Giuliano Pertile" # nameSite has priority over the logo, therefore, will show up first


home = "Home"
# Meta data
description = "This is my personal blog, where I will be sharing my journey as a software engineer."
author = "Franco Giuliano Pertile"
# Contact Information
mobile = "" #Add phone carefully
email = "giulianopertile@gmail.com"
location = "Villa María, Córdoba, Argentina"
# copyright
copyright = "| copyright &copy; 2022 [giulianopertile.com](https://github.com/francofgp/Engineered-Blog) All Rights Reserved |"

# ---- AI SEO / Schema.org metadata ----------------------------------------------------------
# Used by layouts/partials/head-schema.html to emit JSON-LD (WebSite, BlogPosting, Person,
# Organization, BreadcrumbList) and by head.html for Twitter cards (twitter:site/creator).
# Edit these when your bio, role, or handles change — they propagate to every page.
jobTitle = "Software Engineer"
bio = "Software engineer writing about Python, Django, Go, software architecture, and engineering practice."
twitterHandle = "@francofgp" # leading @, used in <meta name="twitter:site"> / "twitter:creator"
# sameAs: profiles that *identify the same Person*. Schema.org uses these to link the author
# entity in the knowledge graph (LinkedIn, GitHub, etc.). Order doesn't matter.
sameAs = [
  "https://github.com/francofgp",
  "https://www.linkedin.com/in/francofgp/",
  "https://twitter.com/francofgp",
  "https://francofgp.github.io/",
]

# search
[params.search]
enable = true

