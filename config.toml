######################## default configuration ####################
baseURL = "https://www.giulianopertile.com/"
# `locale` (lowercase, top-level) is a legacy field from the Liva theme — Hugo itself doesn't
# read it. The canonical Hugo field is `defaultContentLanguage` below, which populates
# `site.Language.Lang` and through it og:locale / JSON-LD inLanguage / <html lang>. Without
# it, `site.Language.Lang` would default to bare "en" (no region), so og:locale would emit
# just "en" instead of the more useful "en_US".
locale = "en-us"
defaultContentLanguage = "en-us"
title = "Giuliano Pertile"
summaryLength = 10

# Suppress the Goldmark raw-HTML warning emitted by draft posts that intentionally
# include inline HTML (e.g. content/blog/new-post.md uses <i>, <b>, etc. as a markdown reference).
ignoreLogs = ['warning-goldmark-raw-html']

[pagination]
pagerSize = 6

[outputs]
# LLMSTXT: emerging llms.txt standard (https://llmstxt.org). A curated, machine-readable
# index of the site's main content for LLMs (ChatGPT, Claude, Perplexity). Lives at /llms.txt
# in the site root. The custom format is defined under [outputFormats.LLMSTXT] below and
# rendered by layouts/_default/list.llmstxt.txt. Only emitted on the home page.
home = ["HTML", "RSS", "JSON", "LLMSTXT"]

# Custom output format for llms.txt. Plain text, not indexed by search engines
# (isPlainText=true skips HTML escaping; the file is markdown-formatted plain text by spec).
[outputFormats.LLMSTXT]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true # Don't expose as a <link rel="alternate"> — it's not an alt format of HTML.

