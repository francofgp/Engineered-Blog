{{ define "main" }}
<section class="section">
  <div class="container">
    <div class="row justify-content-center text-center py-5 my-5">
      <div class="col-lg-8">
        <h1 class="display-1 fw-bold text-body-emphasis mb-3">404</h1>
        <h2 class="h3 mb-4">Page not found</h2>
        <p class="mb-5">
          The page you were looking for doesn't exist &mdash; it may have moved, or never have been here.
          Try the <a href="{{ .Site.BaseURL }}">homepage</a> or browse the <a href="{{ `blog/` | absURL }}">blog</a>.
        </p>
        <a class="btn btn-outline-primary" href="{{ .Site.BaseURL }}">Take me home</a>
      </div>
    </div>
  </div>
</section>
{{ end }}
