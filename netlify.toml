[build]
publish = "public"
command = "hugo --minify --gc"

[build.environment]
HUGO_VERSION = "0.162.0"
HUGO_BASEURL = "https://giulianopertile.com/"
# Node.js usado por el build agent de Netlify (build plugins internos).
# Hugo no consume Node (no hay package.json), pero Netlify deprecó Node 16/18 y
# el default movió a 22 en feb 2025. Pineamos a 24 (Active LTS desde oct 2025,
# EOL abril 2028) — es la versión "más moderna estable": LTS mantenida por
# upstream y soportada por Netlify (que acepta "any released version" vía
# NODE_VERSION). 26 sería Current/non-LTS hasta oct 2026, demasiado bleeding-edge
# para CI. Fijarlo acá hace que netlify.toml gane sobre cualquier override viejo
# en la UI del project.
NODE_VERSION = "24"

[[headers]]
for = "/*" # This defines which paths this specific [[headers]] block will cover.

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "same-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Self-hosted webfonts (static/fonts/*.woff2 -> /fonts/*). Without this they fall to
# Netlify's default and revalidate on every visit, wasting the main perf win of
# self-hosting. `immutable` + a 1-year max-age means the browser never revalidates
# within the year. Netlify MERGES matching header rules, so the /* security headers
# above still apply to /fonts/* — no need to repeat them here.
# CAVEAT: filenames aren't content-hashed. If you ever change a glyph, RENAME the file
# (e.g. archivo.v2.woff2) to bust the cache — otherwise returning visitors keep the
# stale font for up to a year. See docs/THEME.md §History "Self-host fonts".
[[headers]]
for = "/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
